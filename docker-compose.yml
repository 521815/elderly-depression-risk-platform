services:
  backend:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - BACKEND_URL=http://127.0.0.1:8001

  frontend:
    build: .
    command: >
      streamlit run webapp/app.py
      --server.headless true
      --server.port 8501
      --server.fileWatcherType none
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend
